<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电商智能客服 Demo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f6f8; color: #1f2329; }
  header { background: #185FA5; color: #fff; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 15px; margin: 0; font-weight: 500; }
  .wrap { max-width: 720px; margin: 16px auto; padding: 0 12px; }
  .config { background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 13px; }
  .config input, .config select { padding: 6px 8px; border: 1px solid #d0d4da; border-radius: 6px; font-size: 13px; }
  .config button { padding: 6px 12px; border: 1px solid #185FA5; background: #185FA5; color: #fff; border-radius: 6px; cursor: pointer; }
  .box { background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; height: 380px; overflow-y: auto; padding: 14px; }
  .msg { margin: 8px 0; padding: 9px 12px; border-radius: 10px; font-size: 14px; line-height: 1.6; max-width: 85%; }
  .u { background: #e6f1fb; margin-left: auto; }
  .b { background: #f1f2f4; }
  .handoff { background: #fcebeb; border: 1px solid #f0c2c2; }
  .meta { font-size: 11px; color: #888; margin-top: 4px; }
  .input { display: flex; gap: 8px; margin-top: 12px; }
  .input input { flex: 1; padding: 10px; border: 1px solid #d0d4da; border-radius: 8px; font-size: 14px; }
  .input button { padding: 10px 18px; border: none; background: #185FA5; color: #fff; border-radius: 8px; cursor: pointer; }
  .hint { font-size: 12px; color: #888; margin: 6px 2px; }
</style>
</head>
<body>
<header><h1>电商智能客服 · Demo</h1><span style="font-size:12px">个人练手项目</span></header>
<div class="wrap">
  <div class="config">
    <b>配置（可选）</b>：选模型
    <select id="provider">
      <option value="deepseek">DeepSeek</option>
      <option value="qwen">通义千问</option>
      <option value="openai">OpenAI</option>
    </select>
    API Key <input id="apikey" type="password" placeholder="不填则演示模式" size="28">
    <button onclick="saveCfg()">保存</button>
    <span id="cfgstate" class="hint"></span>
  </div>
  <div class="box" id="box"></div>
  <div class="hint">试试：①「能装下手机吗」 ②「退款怎么退」（应转人工） ③「你们家在哪」（知识库外，应转人工）</div>
  <div class="input">
    <input id="q" placeholder="输入顾客问题…" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</div>
<script>
function saveCfg(){
  const provider=document.getElementById('provider').value;
  const apikey=document.getElementById('apikey').value;
  fetch('/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({provider,api_key:apikey})})
   .then(r=>r.json()).then(d=>{
     document.getElementById('cfgstate').innerText = d.has_key? '已启用大模型':'演示模式（未填key）';
   });
}
function addMsg(text,cls,meta){
  const box=document.getElementById('box');
  const d=document.createElement('div');
  d.className='msg '+cls;
  d.innerHTML=text+(meta?`<div class="meta">${meta}</div>`:'');
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
async function send(){
  const q=document.getElementById('q').value.trim();
  if(!q) return;
  addMsg('顾客：'+q,'u');
  document.getElementById('q').value='';
  const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({query:q})});
  const d=await r.json();
  const cls = d.handoff? 'b handoff' : 'b';
  let meta='';
  if(d.source) meta+='命中知识：'+d.source;
  if(d.demo) meta+=(meta?' ｜ ':'')+'演示模式';
  if(d.error) meta+=(meta?' ｜ ':'')+'调用异常';
  addMsg((d.handoff?'[转人工] ':'[AI] ')+d.answer, cls, meta);
}
</script>
</body>
</html>
