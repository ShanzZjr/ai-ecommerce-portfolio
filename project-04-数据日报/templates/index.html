<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>经营数据日报生成器</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; color: #26282c; }
  h1 { font-size: 20px; }
  .panel { background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; padding: 14px; margin-bottom: 14px; font-size: 13px; }
  button { background: #185fa5; color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 14px; }
  button:disabled { background: #9fb6cd; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; }
  .card { flex: 1 1 130px; background: #f2f6fb; border-radius: 8px; padding: 10px; }
  .card b { display: block; font-size: 17px; margin-top: 4px; }
  .card span { color: #6a707a; font-size: 12px; }
  .up { color: #a32d2d; } .down { color: #0f6e56; }  /* 涨红跌绿（国内习惯） */
  .alert { border-left: 4px solid; padding: 8px 10px; margin: 8px 0; border-radius: 6px; }
  .warn { background: #fcebeb; border-color: #a32d2d; }
  .info { background: #e6f1fb; border-color: #185fa5; }
  pre { white-space: pre-wrap; background: #f7f8fa; border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.7; }
  .mode { color: #6a707a; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<h1>项目四 · 经营数据日报生成器</h1>
<div class="panel">
  导入店铺经营数据（演示模式使用 <code>sample_data.csv</code>：生意参谋导出格式，14 天示例），
  自动计算环比、检测异常波动并生成带建议的日报。<button id="go">生成日报</button>
  <div class="mode" id="mode">演示数据为公开示例，非真实店铺数据。</div>
</div>
<div class="panel" id="cards" style="display:none"><div class="cards" id="cardbox"></div></div>
<div class="panel" id="alerts" style="display:none"></div>
<div class="panel" id="daily" style="display:none"></div>
<script>
document.getElementById("go").onclick = async () => {
  const btn = document.getElementById("go");
  btn.disabled = true; btn.textContent = "生成中...";
  try {
    const rows = await (await fetch("/sample")).json();
    const r = await (await fetch("/report", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({rows: rows.rows})
    })).json();
    if (r.error) { alert(r.error); return; }
    render(r);
  } finally { btn.disabled = false; btn.textContent = "生成日报"; }
};
function cls(v) { return v > 0 ? "up" : (v < 0 ? "down" : ""); }
function render(r) {
  const s = r.summary, c = r.changes;
  document.getElementById("cards").style.display = "";
  document.getElementById("cardbox").innerHTML = [
    ["GMV（元）", s.gmv, "环比 " + c.gmv + "%", c.gmv],
    ["访客数", s.uv, "环比 " + c.uv + "%", c.uv],
    ["支付转化率", s.cr + "%", "环比 " + c.cr + "%", c.cr],
    ["客单价（元）", s.aov, "", 0],
    ["退款率", s.refund_rate + "%", "警戒线 8%", 0],
    ["近7天 GMV", s.gmv7, "均转化 " + s.cr7 + "%", 0],
  ].map(x => `<div class="card"><span>${x[0]}</span><b>${x[1]}</b><span class="${cls(x[3])}">${x[2]}</span></div>`).join("");
  const al = document.getElementById("alerts");
  al.style.display = "";
  al.innerHTML = "<b>异常检测</b>" + (r.alerts.length ? r.alerts.map(a =>
    `<div class="alert ${a.level}"><b>${a.date} · ${a.metric}</b> ${a.detail}<br>${a.suggestion}</div>`
  ).join("") : "<div class='alert info'>无异常波动</div>");
  const d = document.getElementById("daily");
  d.style.display = "";
  d.innerHTML = "<b>经营日报</b><pre>" + r.daily_text + "</pre><div class='mode'>" + r.mode + "</div>";
}
</script>
</body>
</html>
